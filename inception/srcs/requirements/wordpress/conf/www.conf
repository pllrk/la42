[www]
user  = www-data
group = www-data

; Listen on a TCP socket instead of a unix socket: nginx lives in a DIFFERENT
; container, so a unix socket on our own filesystem would be invisible to it.
; 9000 is the conventional FastCGI port.
listen = 9000
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

pm = dynamic
pm.max_children       = 5
pm.start_servers      = 2
pm.min_spare_servers  = 1
pm.max_spare_servers  = 3

; Keep the container environment visible to PHP workers.
clear_env = no

; Send worker stdout/stderr to the FPM master, i.e. to `docker logs`.
catch_workers_output = yes
access.log = /proc/self/fd/2
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
